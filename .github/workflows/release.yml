name: release

# Builds the extension and attaches the ZIP to a GitHub Release whenever
# a tag matching `v*` is pushed. Users can then install directly from the
# release page (download zip -> chrome://extensions -> Developer mode ->
# Load unpacked) without waiting for Chrome Web Store review.

on:
  push:
    tags:
      - 'v*'
  # Manual dispatch: useful for verifying workflow changes against an
  # existing tag (softprops/action-gh-release updates an existing
  # release in-place and overwrites matching asset names).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ steps.ref.outputs.tag }}"
          TAG_VERSION="${TAG#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      - name: Prepare release notes
        run: |
          cat > release-notes.md <<EOF
          ## Install

          1. Download \`morpho-enhancements-${VERSION}-unpacked.zip\` below
          2. Unzip it into a stable directory
          3. Open \`chrome://extensions\` in Chrome or another Chromium browser
          4. Enable **Developer mode**
          5. Click **Load unpacked** and select the unzipped directory

          The \`-unpacked.zip\` artifact is for manual installation. The other ZIP is
          the Chrome Web Store upload artifact; both contain the same extension build.

          ## What's changed

          EOF
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture = 1; next }
            capture && $0 ~ "^## \\[" { exit }
            capture { print }
          ' CHANGELOG.md >> release-notes.md

      - name: Unit tests
        run: pnpm test:unit

      - name: Install Chromium for extension E2E
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Extension E2E
        run: xvfb-run --auto-servernum pnpm test:e2e

      - name: Package zip
        run: node scripts/package-zip.mjs

      - name: Also archive unpacked dist/ for Load-Unpacked installs
        run: |
          cd dist
          zip -r "../dist-zip/morpho-enhancements-${VERSION}-unpacked.zip" . -x '*.map' -x '.vite/*'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: false
          body_path: release-notes.md
          files: |
            dist-zip/morpho-enhancements-${{ env.VERSION }}.zip
            dist-zip/morpho-enhancements-${{ env.VERSION }}-unpacked.zip
